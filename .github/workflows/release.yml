name: Release

# 打 tag（v*）触发三平台构建 → 汇总资产 → 创建/更新 GitHub Release。
#
# 说明（已决策 Q5，见 docs/工程规划.md §11.3）：
#   - **不签名、不公证**：Windows SmartScreen 会提示、macOS 需右键打开；
#   - **不启用静默自动更新**：应用内只提供「检查更新 → 引导下载」；
#     将来若启用 Squirrel 自动更新，`RELEASES` 与 `.nupkg` 必须一并上传（本工作流已包含）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（留空则用 tag 名）'
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24.21.0'
  # 上游基线：上游仓库**没有** `Branch_v1.2.0` / `Branch_v0.12.1` 这类分支，等同物是 **tag**；
  # 除按 tag 克隆外还断言 commit SHA（与 upstream.lock.json 一致）——上游重打 tag 会立刻失败（fail-visible）。
  PI_REPO: https://github.com/earendil-works/pi.git
  PI_REF: v1.2.0
  PI_SHA: 06a466935536f8c9bcacb2d5efc0fc021be1bdff
  PI_WEB_REPO: https://github.com/agegr/pi-web.git
  PI_WEB_REF: v0.12.1
  PI_WEB_SHA: f83b1a502f8e434555a7153fe08e1c135dd65ca9

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout pi-desktop
        uses: actions/checkout@v4
        with:
          path: pi-desktop


      # C2（2026-10-13 落地，同日评审加固）：断言「发布版本与 package.json.version 一致」。
      # 动机：Release 的 tag_name 用 `inputs.version || github.ref_name`，若不校验：
      #   - 可以推一个与 package.json 不一致的 tag（发错版）；
      #   - workflow_dispatch 不填 version 时 tag 会退化成**分支名**（main）。
      # 加固点（评审发现）：断言必须与 `tag_name` **用同一个表达式**推导 ——
      #   否则「在 tag ref 上 dispatch 并传一个不同的 version」会绕过校验（断言看 ref，发布看 input）。
      # 输入经 env 注入，不直接拼进脚本（避免引号注入改变控制流）。
      # 允许 workflow_dispatch 传裸版本号（`0.12.1`）——发布 tag 与之一致（无 v 前缀），
      #   这是本地演练里登记过的有意宽容（见 docs/发布与更新.md §3.4）；tag 推送路径只由
      #   `on.push.tags: ['v*']` 触发，恒为 `v<version>` 形态。
      - name: Assert tag/version consistency（tag ↔ package.json.version）
        shell: bash
        working-directory: pi-desktop
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').version")
          want="v$pkg"
          if [ -n "${INPUT_VERSION:-}" ]; then
            got="$INPUT_VERSION"
            src="workflow_dispatch input"
          else
            got="${GITHUB_REF_NAME}"
            src="${GITHUB_REF_TYPE}"
            if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
              echo "::error::workflow_dispatch 必须显式提供 version（应为 $want）——留空会让 Release 的 tag 退化为分支名 ${GITHUB_REF_NAME}"
              exit 1
            fi
          fi
          case "$got" in
            "$want"|"$pkg") echo "版本一致性通过：$src = $got（发布 tag 同此值）｜package.json = $pkg" ;;
            *) echo "::error::版本不一致：$src = $got，package.json = $pkg（应为 $want）"; exit 1 ;;
          esac
      - name: Clone sibling pi（pinned tag + SHA 断言）
        shell: bash
        run: |
          git clone --depth 1 --branch "$PI_REF" "$PI_REPO" pi
          actual=$(git -C pi rev-parse HEAD)
          echo "pi @ $actual（$PI_REF）"
          test "$actual" = "$PI_SHA" || { echo "::error::pi 与钉住的 commit 不一致：期望 $PI_SHA，实际 $actual"; exit 1; }

      - name: Clone sibling pi-web（pinned tag + SHA 断言）
        shell: bash
        run: |
          git clone --depth 1 --branch "$PI_WEB_REF" "$PI_WEB_REPO" pi-web
          actual=$(git -C pi-web rev-parse HEAD)
          echo "pi-web @ $actual（$PI_WEB_REF）"
          test "$actual" = "$PI_WEB_SHA" || { echo "::error::pi-web 与钉住的 commit 不一致：期望 $PI_WEB_SHA，实际 $actual"; exit 1; }

      - name: Ensure ffmpeg（品牌化生成 web 位图图标所需；已装则跳过）
        shell: bash
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then ffmpeg -version | head -1; exit 0; fi
          case "$RUNNER_OS" in
            Windows) choco install ffmpeg -y --no-progress ;;
            macOS)   brew install ffmpeg ;;
            Linux)   sudo apt-get update && sudo apt-get install -y ffmpeg ;;
          esac
          ffmpeg -version | head -1

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: pi-desktop/package-lock.json

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm

      - name: Install pi-desktop dependencies
        working-directory: pi-desktop
        run: npm ci

      - name: Typecheck
        working-directory: pi-desktop
        run: npm run typecheck

      - name: Pin upstream commits
        working-directory: pi-desktop
        run: node scripts/pin-upstream.mjs

      - name: Build pi-web
        working-directory: pi-desktop
        run: node scripts/prepare-next.mjs

      - name: Collect pi-dist
        working-directory: pi-desktop
        run: node scripts/collect-pi.mjs

      - name: Smoke gate
        working-directory: pi-desktop
        run: node scripts/smoke-desktop.mjs

      - name: Package installers
        working-directory: pi-desktop
        run: npx --no-install electron-forge make

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: pi-desktop/out/make/**
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Ensure executable bits（Linux/macOS 资产）
        run: chmod -R +x artifacts || true

      - name: Show asset inventory
        run: find artifacts -maxdepth 2 -type f | sort

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          fail_on_unmatched_files: false
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.nupkg
            artifacts/**/RELEASES
            artifacts/**/*.zip
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.rpm
          body: |
            ## 安装与升级

            - **Windows**：下载 `*.exe` 直接安装（未签名 → 可能出现 SmartScreen 提示，选择「仍要运行」）。
            - **macOS**：下载 `*.dmg`，若系统提示「无法验证开发者」，请**右键 → 打开**（或执行
              `xattr -dr com.apple.quarantine "/Applications/Pi Desktop.app"`）。
            - **Linux**：下载 `*.deb` / `*.rpm` / `*.zip`（`.zip` 解压即用）。

            升级无需手动清理：应用首次启动会校验 `pi-dist` 归档的 SHA-256，与当前包不一致时自动重新解压。

            > 本发布未做代码签名与公证；应用内「检查更新」只会引导到本页面，不会静默下载或安装。
