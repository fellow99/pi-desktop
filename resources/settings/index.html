<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>设置</title>
  <!--
    安全边界与主窗口同级（FR-301-004）：sandbox + contextIsolation + nodeIntegration:false +
    独立最小 preload + 导航收口（settings-window.ts）。不使用 CSP meta：file:// 来源下
    'self' 匹配行为不可靠（可能把 app.js 自身挡住），本页只加载本地静态文件，无数据面。
  -->
  <style>
    :root {
      --bg: #0d1117;
      --bg-panel: #161b22;
      --bg-input: #0d1117;
      --border: #30363d;
      --text: #e6edf3;
      --text-dim: #8b949e;
      --accent: #2f81f7;
      --green: #3fb950;
      --red: #f85149;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
    }
    .tabs {
      display: flex;
      gap: 4px;
      padding: 10px 12px 0;
      border-bottom: 1px solid var(--border);
      background: var(--bg-panel);
    }
    .tab {
      padding: 7px 14px;
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
      background: transparent;
      font: inherit;
    }
    .tab:hover { color: var(--text); }
    .tab.active {
      color: var(--text);
      background: var(--bg);
      border-color: var(--border);
      border-bottom: 1px solid var(--bg);
      margin-bottom: -1px;
    }
    .page { display: none; flex: 1; overflow: auto; padding: 18px 20px; }
    .page.active { display: block; }
    .placeholder { color: var(--text-dim); }
    h2 { font-size: 16px; margin: 0 0 14px; }
    .row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .row label { flex: 0 0 96px; color: var(--text-dim); }
    .row input[type="text"], .row input[type="url"], .row input[type="password"] {
      flex: 1;
      background: var(--bg-input);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font: inherit;
      outline: none;
    }
    .row input:focus { border-color: var(--accent); }
    /* 状态灯 */
    .status { display: flex; align-items: center; gap: 8px; }
    .dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 6px rgba(248, 81, 73, 0.7);
      flex: none;
    }
    .dot.on {
      background: var(--green);
      box-shadow: 0 0 6px rgba(63, 185, 80, 0.7);
    }
    #statusText { color: var(--text-dim); }
    /* 令牌显示切换 */
    .toggle-show {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      padding: 5px 10px;
      cursor: pointer;
      font: inherit;
      white-space: nowrap;
    }
    .toggle-show:hover { color: var(--text); border-color: var(--text-dim); }
    /* 启用开关 */
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: var(--border);
      border-radius: 22px;
      transition: background 0.15s;
      cursor: pointer;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 16px; height: 16px;
      left: 3px; top: 3px;
      background: var(--text-dim);
      border-radius: 50%;
      transition: transform 0.15s, background 0.15s;
    }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider::before { transform: translateX(18px); background: #fff; }
    .actions { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
    #applyBtn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 22px;
      font: inherit;
      cursor: pointer;
    }
    #applyBtn:hover { background: #4493f8; }
    #applyBtn:disabled { opacity: 0.5; cursor: default; }
    #msg { min-height: 20px; font-size: 13px; }
    #msg.ok { color: var(--green); }
    #msg.err { color: var(--red); }
    .hint { color: var(--text-dim); font-size: 12px; margin-top: 10px; }
  </style>
</head>
<body>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-page="sync" role="tab">中枢服务</button>
    <button class="tab" data-page="general" role="tab">常规</button>
    <button class="tab" data-page="about" role="tab">关于</button>
  </nav>

  <section id="page-sync" class="page active">
    <h2>中枢服务（sync-daemon）</h2>

    <div class="row">
      <label>连接状态</label>
      <div class="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">未知</span>
      </div>
    </div>

    <div class="row">
      <label for="hubUrl">中枢服务地址</label>
      <input id="hubUrl" type="url" placeholder="http://127.0.0.1:12380" spellcheck="false" />
    </div>

    <div class="row">
      <label for="hostName">本端名称</label>
      <input id="hostName" type="text" placeholder="例如 win-pi-desktop" spellcheck="false" />
    </div>

    <div class="row">
      <label for="hubToken">本端令牌</label>
      <input id="hubToken" type="password" placeholder="中枢分配的 daemon token" spellcheck="false" />
      <button class="toggle-show" id="toggleToken" type="button">显示</button>
    </div>

    <div class="row">
      <label for="enabled">是否启用</label>
      <span class="switch">
        <input type="checkbox" id="enabled" />
        <label class="slider" for="enabled"></label>
      </span>
    </div>

    <div class="actions">
      <button id="applyBtn" type="button">应用</button>
      <span id="msg"></span>
    </div>

    <p class="hint">
      应用后将按新配置（重）启动同步守护进程。插件运行参数（本端 pi-web 地址 / 会话目录 / 密码）由应用自动注入，无需手工填写。
    </p>
  </section>

  <section id="page-general" class="page">
    <h2>常规</h2>
    <p class="placeholder">（占位：本轮未实现）</p>
  </section>

  <section id="page-about" class="page">
    <h2>关于</h2>
    <p class="placeholder">Pi Desktop 设置窗口（原生实现，模块 301-sync-daemon）</p>
  </section>

  <script src="app.js"></script>
</body>
</html>
